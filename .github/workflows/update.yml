name: Update AUR packages

on:
  schedule:
    - cron: '0 2 * * *' # daily 02:00 UTC = 10:00 CST
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: aur-update
  cancel-in-progress: false

jobs:
  update:
    name: ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [pineapple-notepad-bin, genoffice-bin, gety-bin]
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream version (nvchecker)
        id: check
        run: |
          pip install --quiet --break-system-packages nvchecker
          nvchecker -c "${{ matrix.pkg }}/nvchecker.toml" --logger json --json-log-fd 3 3>&1 >/dev/null 2>&1 |
            jq -r 'select(.event == "updated") | .version' > /tmp/newver
          NEWVER=$(cat /tmp/newver 2>/dev/null || true)
          OLDVER=$(grep '^pkgver=' "${{ matrix.pkg }}/PKGBUILD" | cut -d= -f2)
          if [ -z "$NEWVER" ] || [ "$NEWVER" = "$OLDVER" ]; then
            echo "no update: current=$OLDVER latest=$NEWVER"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "update: $OLDVER -> $NEWVER"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "newver=$NEWVER" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Linux .deb assets exist
        id: verify
        if: steps.check.outputs.updated == 'true'
        run: |
          cd "${{ matrix.pkg }}"
          URLS=$(awk '/^source=\(/,/^\)/' PKGBUILD | grep -oE "https://[^'\" )]+" | sed "s/\${pkgver}/${{ steps.check.outputs.newver }}/g" | sort -u)
          if [ -z "$URLS" ]; then
            echo "no http sources found, nothing to verify"
            echo "has_deb=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for u in $URLS; do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 20 "$u" || echo 000)
            echo "$code $u"
            if [ "$code" != "200" ]; then
              echo "::warning::upstream ${{ steps.check.outputs.newver }} has no downloadable Linux asset (HTTP $code); ignoring this release"
              echo "has_deb=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "has_deb=true" >> "$GITHUB_OUTPUT"

      - name: Build and check (Arch container)
        if: steps.check.outputs.updated == 'true' && steps.verify.outputs.has_deb == 'true'
        env:
          NEWVER: ${{ steps.check.outputs.newver }}
        run: |
          docker run --rm -v "$PWD":/build -w /build archlinux:latest bash -c "
            pacman -Syu --noconfirm --needed base-devel namcap pacman-contrib >/dev/null &&
            source ${{ matrix.pkg }}/PKGBUILD &&
            pacman -S --noconfirm --needed \${depends[@]} \${makedepends[@]} >/dev/null &&
            useradd -m build && chown -R build:build "/build/${{ matrix.pkg }}" &&
            su build -c 'bash /build/scripts/update_pkg.sh ${{ matrix.pkg }} $NEWVER'
          "

      - name: Commit and push to this repo
        if: steps.check.outputs.updated == 'true' && steps.verify.outputs.has_deb == 'true'
        env:
          NEWVER: ${{ steps.check.outputs.newver }}
        run: |
          git config user.name "alex3236"
          git config user.email "me@alex3236.moe"
          git add "${{ matrix.pkg }}/PKGBUILD" "${{ matrix.pkg }}/.SRCINFO"
          if git diff --cached --quiet; then
            echo "no diff to commit"
            exit 0
          fi
          git commit -m "${{ matrix.pkg }}: update to $NEWVER"
          git push

      - name: Push to AUR
        if: steps.check.outputs.updated == 'true' && steps.verify.outputs.has_deb == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          bash scripts/push_aur.sh "${{ matrix.pkg }}" "${{ matrix.pkg }}"

      - name: Close stale issue
        if: steps.check.outputs.updated == 'true' && steps.verify.outputs.has_deb == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "[${{ matrix.pkg }}] update to ${{ steps.check.outputs.newver }} failed"
        run: |
          gh issue list --state open --json number,title --jq '.[] | select(.title == $ENV.TITLE) | .number' |
            while read -r n; do gh issue close "$n" -c "Fixed by the automated update to ${{ steps.check.outputs.newver }}"; done

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: |
            Auto-update of **${{ matrix.pkg }}** to ${{ steps.check.outputs.newver }} failed.

            Check the failing job: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="[${{ matrix.pkg }}] update to ${{ steps.check.outputs.newver }} failed"
          if gh issue list --state open --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "issue already open, skipping"
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$BODY"

      - name: Watch terms of service changes (gety-bin)
        if: matrix.pkg == 'gety-bin'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAW=$(curl -sL --max-time 20 https://gety.ai/terms | grep -oE 'Effective as of: [A-Z][a-z]+ [0-9]{1,2}, [0-9]{4}' | head -1 | sed 's/Effective as of: //')
          if [ -z "$RAW" ]; then
            echo "could not extract terms effective date; skipping"
            exit 0
          fi
          ISO=$(python3 -c "
          import sys
          months = {'January':1,'February':2,'March':3,'April':4,'May':5,'June':6,'July':7,'August':8,'September':9,'October':10,'November':11,'December':12}
          m, d, y = sys.argv[1].replace(',','').split()
          print(f'{y}-{months[m]:02d}-{int(d):02d}')
          " "$RAW")
          CUR=$(cat gety-bin/terms-effective-date)
          if [ "$ISO" != "$CUR" ]; then
            echo "terms effective date changed: $CUR -> $ISO"
            TITLE="[gety-bin] Terms of Service updated ($ISO)"
            if gh issue list --state open --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
              echo "issue already open"
              exit 0
            fi
            gh issue create --title "$TITLE" --body "Gety's Terms of Service (https://gety.ai/terms) effective date changed: tracked \`$CUR\` -> \`$ISO\`.\n\nRefresh \`gety-bin/gety-license.txt\` and update \`gety-bin/terms-effective-date\` to \`$ISO\`."
          else
            echo "terms unchanged ($ISO)"
          fi
